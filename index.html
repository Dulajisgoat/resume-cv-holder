<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumé/CV holder</title>
<script>
(function(){try{var d=document.documentElement,s=window.localStorage;
  if(s.getItem('vanilla-theme')==='light') d.setAttribute('data-theme','light');
  if(s.getItem('vanilla-lite')==='1') d.classList.add('lite');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120D0C;
    --line:rgba(255,255,255,0.12);
    --line-soft:rgba(255,255,255,0.06);
    --ink:#F1E9E1;
    --ink-dim:#B9AC9F;
    --ink-faint:#7E7069;
    --sanguine:#7A2027;
    --sanguine-bright:#B03A3F;
    --sanguine-deep:#4E1519;
    --glass-fill: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.37), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
    --radius-lg: 24px;
    --radius-md: 16px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow:hidden;
  }
  ::selection{ background:var(--sanguine-deep); color:var(--ink); }
  [hidden]{ display:none !important; }

  #webgl-bg{ position:fixed; top:0; left:0; width:100%; height:100%; z-index:-2; }
  .stripes{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(176,58,63,0.03) 40px, rgba(176,58,63,0.03) 41px);
  }
  .side-stripe{
    position:fixed; top:0; left:0; width:4px; height:100%; z-index:50;
    background:linear-gradient(to bottom, var(--sanguine-deep), var(--sanguine-bright), var(--sanguine-deep));
  }

  .glass{
    position:relative; background:var(--glass-fill);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
    border-radius:var(--radius-lg); overflow:hidden;
  }
  .glass::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg, rgba(176,58,63,0.5), rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.1) 60%, rgba(176,58,63,0.3));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; z-index:1;
  }
  .glass::after{
    content:""; position:absolute; top:0; left:20%; right:20%; height:40%;
    background:radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 70%);
    pointer-events:none; z-index:1;
  }

  /* ---------- auth ---------- */
  #auth{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  #auth.leaving{ opacity:0; transform:translateY(-8px); pointer-events:none; }
  .card{ width:100%; max-width:420px; padding:44px 40px 36px; position:relative; }
  .card > *{ position:relative; z-index:2; }
  .kicker{ font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); display:block; margin-bottom:14px; }
  h1{ margin:0; font-weight:300; font-size:44px; line-height:1; letter-spacing:-0.045em; }
  h1 em{ font-style:normal; color:var(--sanguine-bright); font-weight:400; }
  .sub{ margin:14px 0 0; font-size:14px; font-weight:300; color:var(--ink-dim); }

  .tabs{ display:flex; gap:6px; margin:30px 0 22px; padding:5px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--line); position:relative; }
  .tabs button{
    all:unset; flex:1; position:relative; z-index:1; text-align:center; cursor:pointer; padding:9px 0; border-radius:999px;
    font-size:12px; font-weight:500; letter-spacing:0.02em; color:var(--ink-dim); transition:all .25s var(--ease);
  }
  .tabs button:hover{ color:var(--ink); }
  .tabs button.on{ color:#fff; }
  .tabs button:focus-visible{ outline:1px solid var(--sanguine-bright); outline-offset:2px; }

  label.f{ display:block; margin-bottom:16px; }
  label.f span{ display:block; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; font-weight:500; }
  .inp{ position:relative; }
  .inp input{
    width:100%; font:inherit; font-size:15px; font-weight:300; color:var(--ink);
    padding:13px 16px; border-radius:var(--radius-md); background:rgba(255,255,255,0.05);
    border:1px solid var(--line); outline:none; transition:border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .inp input::placeholder{ color:var(--ink-faint); }
  .inp input:focus{ border-color:var(--sanguine-bright); background:rgba(255,255,255,0.07); box-shadow:0 0 0 3px rgba(176,58,63,0.18); }
  .inp input.pw{ padding-right:64px; }
  .inp .eye{
    all:unset; position:absolute; right:8px; top:50%; transform:translateY(-50%); cursor:pointer;
    font-size:11px; font-weight:500; letter-spacing:0.06em; color:var(--ink-faint); padding:6px 10px; border-radius:999px; transition:color .2s var(--ease);
  }
  .inp .eye:hover{ color:var(--ink); }

  .msg{ min-height:20px; margin:2px 0 14px; font-size:13px; font-weight:400; color:var(--ink-faint); }
  .msg.err{ color:#E4797D; }
  .msg.ok{ color:var(--ink-dim); }
  .msg.uname{ margin:6px 0 0; min-height:20px; font-size:12px; }
  .msg.uname.checking{ animation:unamepulse 1.1s var(--ease) infinite; }
  @keyframes unamepulse{ 50%{ opacity:.45; } }
  @media (prefers-reduced-motion:reduce){ .msg.uname.checking{ animation:none; } }

  .go{
    all:unset; box-sizing:border-box; width:100%; text-align:center; cursor:pointer; font-weight:500; font-size:14px; letter-spacing:0.02em; color:#fff;
    padding:14px 18px; border-radius:999px; background:rgba(176,58,63,0.3); border:1px solid var(--sanguine-bright); transition:all .2s var(--ease);
  }
  .go:hover{ background:rgba(176,58,63,0.5); }
  .go:active{ transform:scale(0.98); }
  .go:disabled{ opacity:.55; cursor:default; transform:none; }
  .go:focus-visible{ outline:1px solid #fff; outline-offset:3px; }
  .foot{ margin:22px 0 0; font-size:12px; font-weight:300; color:var(--ink-faint); text-align:center; }

  /* ---------- app ---------- */
  #app{ position:fixed; inset:0; opacity:0; transition:opacity .6s var(--ease); }
  #app.in{ opacity:1; }
  #app iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  .account{
    position:fixed; right:24px; bottom:24px; z-index:200; border-radius:999px;
    display:flex; align-items:center; gap:10px; padding:8px 8px 8px 18px;
  }
  .account > *{ position:relative; z-index:2; }
  .account .who{ font-size:12px; color:var(--ink-dim); letter-spacing:0.02em; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account .role{
    font-size:10px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase; color:var(--sanguine-bright);
  }
  .account button{
    all:unset; cursor:pointer; font-weight:500; font-size:12px; color:var(--ink); padding:10px 16px; border-radius:999px;
    background:rgba(255,255,255,0.08); border:1px solid transparent; transition:all .2s var(--ease);
  }
  .account button:hover{ background:rgba(176,58,63,0.3); border-color:var(--sanguine-bright); color:#fff; }
  .account button:active{ transform:scale(0.96); }
  @media (max-width:640px){ .account .who{ display:none; } .account{ right:16px; bottom:16px; } .card{ padding:36px 26px 30px; } h1{ font-size:38px; } }
  @media print{ .account{ display:none !important; } }

  /* ---------- theme + lower-end device mode ---------- */
  :root{
    --lite-top:#170F0E; --lite-bot:#0E0A09;
    --lite-glow1:rgba(176,58,63,0.34); --lite-glow2:rgba(122,32,39,0.32);
    --lite-edge:rgba(176,58,63,0.16); --lite-sheen:rgba(255,255,255,0.07);
    --lite-card:rgba(26,18,17,0.80);
  }
  html[data-theme="light"]{
    --bg:#F4ECE4;
    --line:rgba(78,21,25,0.14);
    --line-soft:rgba(78,21,25,0.07);
    --ink:#2B1B19;
    --ink-dim:#5C4A45;
    --ink-faint:#75655E;
    --sanguine-bright:#A33339;
    --glass-fill:rgba(255,255,255,0.55);
    --glass-border:rgba(122,32,39,0.16);
    --glass-shadow:0 8px 32px rgba(78,21,25,0.14), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(78,21,25,0.06);
    --lite-top:#F8F2EC; --lite-bot:#EFE5DB;
    --lite-glow1:rgba(176,58,63,0.22); --lite-glow2:rgba(122,32,39,0.15);
    --lite-edge:rgba(163,51,57,0.10); --lite-sheen:rgba(255,255,255,0.85);
    --lite-card:rgba(255,255,255,0.80);
  }
  body{ transition:background-color .35s var(--ease), color .35s var(--ease); }
  .glass{ transition:background-color .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease); }

  html[data-theme="light"] ::selection{ background:rgba(176,58,63,0.25); }
  html[data-theme="light"] .glass::before{
    background:linear-gradient(135deg, rgba(163,51,57,0.45), rgba(122,32,39,0.08) 40%, rgba(122,32,39,0.08) 60%, rgba(163,51,57,0.3));
  }
  html[data-theme="light"] .glass::after{ background:radial-gradient(ellipse at center top, rgba(255,255,255,0.7), transparent 70%); }
  html[data-theme="light"] .tabs{ background:rgba(78,21,25,0.05); }
  html[data-theme="light"] .tabs button.on{ color:var(--sanguine); }
  html[data-theme="light"] .tabs .pill{ background:rgba(176,58,63,0.14); }
  html[data-theme="light"] .inp input{ background:rgba(255,255,255,0.6); }
  html[data-theme="light"] .inp input:focus{ background:rgba(255,255,255,0.92); box-shadow:0 0 0 3px rgba(163,51,57,0.16); }
  html[data-theme="light"] .msg.err{ color:#B3262E; }
  html[data-theme="light"] .go{ background:rgba(163,51,57,0.92); color:#fff; }
  html[data-theme="light"] .go:hover{ background:var(--sanguine); }
  html[data-theme="light"] .go:focus-visible{ outline-color:var(--sanguine); }
  html[data-theme="light"] .account button{ background:rgba(78,21,25,0.06); }
  html[data-theme="light"] .account button:hover{ background:rgba(176,58,63,0.16); color:var(--ink); }

  /* top-right controls */
  .card > .tools{ position:absolute; top:18px; right:18px; z-index:5; display:flex; gap:8px; }
  .tool{
    all:unset; box-sizing:border-box; position:relative; display:grid; place-items:center; width:34px; height:34px; cursor:pointer;
    border-radius:999px; color:var(--ink-dim); background:rgba(255,255,255,0.06); border:1px solid var(--line);
    transition:color .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
  }
  html[data-theme="light"] .tool{ background:rgba(78,21,25,0.05); }
  .tool:hover{ color:var(--ink); border-color:var(--sanguine-bright); }
  .tool:active{ transform:scale(0.94); }
  .tool:focus-visible{ outline:1px solid var(--sanguine-bright); outline-offset:2px; }
  .tool[aria-pressed="true"]{ background:rgba(176,58,63,0.3); border-color:var(--sanguine-bright); color:#fff; }
  html[data-theme="light"] .tool[aria-pressed="true"]{ background:rgba(176,58,63,0.16); color:var(--sanguine); }
  .tool::after{
    content:attr(data-tip); position:absolute; top:calc(100% + 8px); right:0; white-space:nowrap; pointer-events:none;
    font-size:11px; font-weight:500; letter-spacing:0.02em; color:var(--ink); padding:6px 10px; border-radius:999px;
    background:var(--bg); border:1px solid var(--line); opacity:0; transform:translateY(-3px);
    transition:opacity .18s var(--ease), transform .18s var(--ease);
  }
  .tool:focus-visible::after{ opacity:1; transform:none; }
  @media (hover:hover){ .tool:hover::after{ opacity:1; transform:none; } }

  /* CSS-drawn icons */
  .ic{ position:relative; display:block; width:18px; height:18px; }
  .ic i{ position:absolute; inset:0; display:block; transition:opacity .3s var(--ease), transform .4s var(--ease); }
  .ic-sun::before{ content:""; position:absolute; inset:5px; border-radius:50%; background:currentColor; }
  .ic-sun::after{
    content:""; position:absolute; inset:0;
    background:repeating-conic-gradient(from -7deg, currentColor 0 14deg, transparent 14deg 45deg);
    -webkit-mask:radial-gradient(circle, transparent 6.5px, #000 7px, #000 9px, transparent 9.5px);
            mask:radial-gradient(circle, transparent 6.5px, #000 7px, #000 9px, transparent 9.5px);
  }
  .ic-moon::before{ content:""; position:absolute; inset:2px; border-radius:50%; box-shadow:inset -5px -3px 0 0 currentColor; transform:rotate(-20deg); }
  html:not([data-theme="light"]) .ic-moon{ opacity:0; transform:rotate(-70deg) scale(.5); }
  html[data-theme="light"] .ic-sun{ opacity:0; transform:rotate(70deg) scale(.5); }
  .ic .ic-bolt{ inset:1px; background:currentColor; clip-path:polygon(60% 0%, 18% 56%, 46% 56%, 38% 100%, 82% 42%, 54% 42%); }

  /* lower-end device mode: no WebGL, no backdrop blur, static glossy side panels */
  #lite-bg{ position:fixed; inset:0; z-index:-2; display:none; pointer-events:none; overflow:hidden;
    background:
      radial-gradient(55% 70% at 0% 35%, var(--lite-glow1), transparent 70%),
      radial-gradient(50% 65% at 100% 70%, var(--lite-glow2), transparent 70%),
      linear-gradient(180deg, var(--lite-top), var(--lite-bot));
  }
  #lite-bg::before, #lite-bg::after{
    content:""; position:absolute; top:-10%; bottom:-10%; width:clamp(90px, 22vw, 320px);
  }
  #lite-bg::before{
    left:0;
    -webkit-mask-image:linear-gradient(to right, #000 35%, transparent);
            mask-image:linear-gradient(to right, #000 35%, transparent);
    background:
      linear-gradient(105deg, transparent 8%, var(--lite-sheen) 26%, transparent 46%),
      linear-gradient(to right, var(--lite-edge), transparent);
  }
  #lite-bg::after{
    right:0;
    -webkit-mask-image:linear-gradient(to left, #000 35%, transparent);
            mask-image:linear-gradient(to left, #000 35%, transparent);
    background:
      linear-gradient(255deg, transparent 8%, var(--lite-sheen) 26%, transparent 46%),
      linear-gradient(to left, var(--lite-edge), transparent);
  }
  html.lite #lite-bg{ display:block; }
  html.lite #webgl-bg, html.lite .stripes{ display:none; }
  html.lite .glass{ -webkit-backdrop-filter:none; backdrop-filter:none; background:var(--lite-card); }
  @media (prefers-reduced-motion:reduce){ .ic i, .tool, .tool::after{ transition:none; } }
  /* ---------- motion ---------- */
  .tabs .pill{
    position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 16px) / 2); border-radius:999px; pointer-events:none;
    background:rgba(176,58,63,0.3); box-shadow:inset 0 0 0 1px var(--sanguine-bright);
    transition:transform .55s cubic-bezier(.34,1.32,.64,1), background-color .35s var(--ease);
  }
  .tabs.up .pill{ transform:translateX(calc(100% + 6px)); }
  .tabs button{ transition:color .3s var(--ease); }

  .reveal{
    display:grid; grid-template-rows:0fr; opacity:0; visibility:hidden;
    transition:grid-template-rows .5s var(--ease), opacity .25s var(--ease), visibility 0s linear .5s;
  }
  .reveal.open{
    grid-template-rows:1fr; opacity:1; visibility:visible;
    transition:grid-template-rows .5s var(--ease), opacity .4s var(--ease) .1s, visibility 0s;
  }
  .reveal > div{ min-height:0; overflow:hidden; padding:4px; margin:-4px; }

  @keyframes rise{ from{ opacity:0; transform:translateY(12px); } }
  .card{ animation:rise .7s var(--ease) both; }
  .card > :not(.tools){ animation:rise .6s var(--ease) both; }
  .card > :nth-child(2){ animation-delay:.10s; }
  .card > :nth-child(3){ animation-delay:.16s; }
  .card > :nth-child(4){ animation-delay:.22s; }
  .card > :nth-child(5){ animation-delay:.28s; }
  .card > :nth-child(6){ animation-delay:.34s; }
  .card > :nth-child(7){ animation-delay:.40s; }
  @media (prefers-reduced-motion:reduce){
    .card, .card > :not(.tools){ animation:none; }
    .tabs .pill, .tabs button, .reveal, .reveal.open{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="webgl-bg"></canvas>
<div id="lite-bg"></div>
<div class="stripes"></div>
<div class="side-stripe"></div>

<section id="auth" hidden>
  <div class="card glass">
    <div class="tools">
      <button type="button" class="tool" id="theme-toggle" data-tip="Switch to light mode" aria-label="Switch to light mode">
        <span class="ic"><i class="ic-sun"></i><i class="ic-moon"></i></span>
      </button>
      <button type="button" class="tool" id="lite-toggle" data-tip="Lower-end device mode: Off" aria-label="Lower-end device mode" aria-pressed="false">
        <span class="ic"><i class="ic-bolt"></i></span>
      </button>
    </div>
    <span class="kicker">Résumé</span>
    <h1>Resumé/CV <em>holder</em></h1>
    <p class="sub" id="sub">Sign in to continue.</p>

    <div class="tabs" role="tablist">
      <span class="pill" aria-hidden="true"></span>
      <button type="button" role="tab" id="tab-in" class="on" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-up" aria-selected="false">Create account</button>
    </div>

    <form id="form" novalidate>
      <label class="f"><span>Username</span>
        <div class="inp"><input id="email" type="text" autocomplete="username" placeholder="yourname" required></div>
        <div class="reveal" id="uname-reveal"><div><div class="msg uname" id="uname-status" role="status" aria-live="polite"></div></div></div>
      </label>
      <label class="f"><span>Password</span>
        <div class="inp"><input id="pass" class="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="eye" id="eye" aria-label="Show password">Show</button></div>
      </label>
      <div class="reveal" id="confirm-reveal"><div>
        <label class="f" id="confirm-wrap"><span>Confirm password</span>
          <div class="inp"><input id="pass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>
        </label>
      </div></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button class="go" id="go" type="submit">Sign in</button>
    </form>
    <p class="foot" id="foot">New here? Create an account to view the résumé.</p>
  </div>
</section>

<div id="app" hidden>
  <iframe id="frame" title="Résumé"></iframe>
  <div class="account glass">
    <span class="who" id="who"></span>
    <span class="role" id="role"></span>
    <button type="button" id="out">Sign out</button>
  </div>
</div>

  #webgl-bg {

    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(176, 58, 63, 0.03) 40px,
      rgba(176, 58, 63, 0.03) 41px
    );
  }

  .side-stripe {
    position: fixed;
    top: 0; left: 0;

  .glass{
    position:relative;
    background:var(--glass-fill);
    -webkit-backdrop-filter: blur(20px) saturate(180%);

    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 1;
  }

  .glass::after {
    content: "";
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 40%;
    background: radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 70%);

    z-index: 1;

  @media print{

      --bg:#ffffff; --ink:#141414; --ink-dim:#3a3a3a; --ink-faint:#666666;

      uniform float u_time;
      uniform vec2 u_mouse;

        return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);

      float noise(vec2 st) {
        vec2 i = floor(st);
        vec2 f = fract(st);
        float a = random(i);
        float b = random(i + vec2(1.0, 0.0));
        float c = random(i + vec2(0.0, 1.0));
        float d = random(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0 * f);

      var link = chip.querySelector('a');
      if(/^blob:/.test(link.getAttribute('href') || '')) URL.revokeObjectURL(link.getAttribute('href'));

      link.href = url;
      link.textContent = file.name;
      link.removeAttribute('data-cert-path');
      chip.classList.add('show');
      (async function(){
        var mine = link.__certSeq = (link.__certSeq || 0) + 1;
        var stage = 'start', certPath = '';
        try{
          log('Cert selected: ' + file.name + ' size=' + file.size + ' type=' + file.type);
          if(file.size === 0) throw new Error('file is empty');
          stage = 'getUser';
          var u = await sb.auth.getUser();
          if(u.error) throw u.error;
          var userId = u.data && u.data.user ? u.data.user.id : null;
          if(!userId) throw new Error('No signed-in user');
          stage = 'upload';
          var ext = (file.name.indexOf('.') !== -1 ? file.name.split('.').pop() : '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
          certPath = userId + '/certs/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + (ext ? '.' + ext : '');
          log('Uploading to cvs/' + certPath);
          var up = await sb.storage.from('cvs').upload(certPath, file, { upsert: false, contentType: file.type || 'application/octet-stream' });
          if(up.error) throw up.error;
          log('Upload result: success');
          if(link.__certSeq !== mine || !chip.classList.contains('show')){

  function initExperiences(){

    var OK_TYPE = { 'image/jpeg':1, 'image/png':1, 'image/webp':1, 'image/gif':1, 'image/avif':1, 'video/mp4':1, 'video/webm':1, 'video/quicktime':1 };

    var xList = g('exp-list'), xEditor = g('exp-editor'), xStatus = g('exp-status'), xSaved = g('exp-saved');
    var xNew = g('exp-new'), xClose = g('exp-close'), xDel = g('exp-del');

    var xDrop = g('exp-drop'), xFile = g('exp-file'), xGrid = g('exp-grid');
    if(!xList || !xEditor || !xGrid) return;

    var posts = [];            // rows as last saved / loaded
    var cur = null, sel = null; // working copy of the post being edited, and its id
    var xReady = false;        // saving stays off until the list has loaded
    var xPending = false, xSaving = false, xDirty = false, xTimer = 0, xHintTimer = 0;
    var removals = [];         // storage paths to delete once the post row no longer references them
    var uploads = [], upSeq = 0, upChain = Promise.resolve();
    var previews = new Map();  // path -> blob: URL of a file uploaded this session (no signed URL needed)
    var urlCache = new Map();  // path -> { url, exp } (signed URLs live only here, never in the DOM's data- attributes)
    var urlPending = new Map();// path -> in-flight signing job

    function setStatus(t){ xStatus.textContent = t || ''; }
    function setSaved(t){ xSaved.textContent = t || ''; }
    function jd(err){ try{ return JSON.stringify(err); }catch(x){ return String(err); } }
    function msgOf(err){ return err && err.message ? err.message : String(err); }
    function oneLine(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }
    function fmtDate(iso){
      try{ return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }catch(e){ return ''; }
    }

    /* same allowlist as the viewer's copyClean: only plain text, line breaks and basic emphasis survive */
    var KEEP = { BR:1, B:1, STRONG:1, I:1, EM:1, U:1, DIV:1, P:1, SPAN:1 };
    var DROP = { SCRIPT:1, STYLE:1, IFRAME:1, OBJECT:1, EMBED:1, TEMPLATE:1 };
    function copyClean(from, to){
      from.childNodes.forEach(function(n){
        if(n.nodeType === 3){ to.appendChild(document.createTextNode(n.nodeValue)); }
        else if(n.nodeType === 1){
          if(DROP[n.tagName]) return;
          if(KEEP[n.tagName]){ var el = document.createElement(n.tagName.toLowerCase()); copyClean(n, el); to.appendChild(el); }
          else copyClean(n, to);

      });
    }
    function setBody(html){
      xBody.textContent = '';
      var doc;

      if(doc && doc.body) copyClean(doc.body, xBody);
    }

    /* ---------- signed URLs (batched, cached by path) ---------- */
    function cachedUrl(path){
      var c = urlCache.get(path);
      return c && c.exp - Date.now() > 60000 ? c.url : '';
    }
    function signMany(paths){
      var need = [], waits = [];
      paths.forEach(function(p){
        if(!p || cachedUrl(p)) return;
        if(urlPending.has(p)){ waits.push(urlPending.get(p)); return; }
        if(need.indexOf(p) === -1) need.push(p);
      });
      if(need.length){
        var job = (async function(){
          log('createSignedUrl called for path: ' + need.join(', '));
          try{
            var r = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
            if(r.error) throw r.error;
            var okN = 0;
            (r.data || []).forEach(function(row){
              if(row && row.signedUrl){ urlCache.set(row.path, { url: row.signedUrl, exp: Date.now() + 3600 * 1000 }); okN++; }
              else if(row){ log('Signed URL error: ' + (row.error || 'no URL returned') + ' | path=' + row.path); }
            });
            log('Signed URL result: ok (' + okN + '/' + need.length + ')');
          }catch(err){
            log('Signed URL error: ' + msgOf(err) + ' | details=' + jd(err) + ' — retrying one by one');
            await Promise.all(need.map(function(p){
              return sb.storage.from(BUCKET).createSignedUrl(p, 3600).then(function(r){
                if(r.error || !r.data || !r.data.signedUrl) throw (r.error || new Error('no signed URL returned'));
                urlCache.set(p, { url: r.data.signedUrl, exp: Date.now() + 3600 * 1000 });
                log('Signed URL result: ok');
              }).catch(function(e2){
                log('Signed URL error: ' + msgOf(e2) + ' | details=' + jd(e2) + ' | path=' + p);
                showDebug();
              });
            }));
          }
        })();
        need.forEach(function(p){ urlPending.set(p, job); });
        var clear = function(){ need.forEach(function(p){ if(urlPending.get(p) === job) urlPending.delete(p); }); };
        job.then(clear, clear);
        waits.push(job);
      }
      return Promise.all(waits);
    }
    function srcFor(path, isVideo){
      var u = previews.get(path) || cachedUrl(path);
      return u ? (isVideo ? u + '#t=0.1' : u) : '';
    }
    function applySrcs(box){
      box.querySelectorAll('[data-path]').forEach(function(el){
        if(el.getAttribute('src')) return;
        var s = srcFor(el.getAttribute('data-path'), el.tagName === 'VIDEO');
        if(s) el.src = s;

    }
    function missingPaths(box){

    /* ---------- post helpers ---------- */
    function cleanEntry(en){

        tags: Array.isArray(p.tags) ? p.tags.slice() : [], published: !!p.published, created_at: p.created_at
      };

    function coverOf(media){
      for(var i = 0; i < media.length; i++){ if(media[i].type === 'image') return media[i].path; }

    /* ---------- autosave to posts (same debounce pattern as scheduleSave, separate path) ---------- */
    function scheduleExpSave(){
      if(!xReady || !cur) return;
      clearTimeout(xHintTimer);
      xPending = true;
      setSaved('Saving…');
      clearTimeout(xTimer);
      xTimer = setTimeout(doExpSave, 700);
    }
    async function purge(paths){
      if(!paths.length) return;
      log('Removing from ' + BUCKET + ': ' + paths.join(', '));
      try{
        var r = await sb.storage.from(BUCKET).remove(paths);
        if(r.error) throw r.error;
        var n = (r.data || []).length;
        if(n < paths.length){ log('Remove error: only ' + n + ' of ' + paths.length + ' file(s) removed (check storage policies)'); showDebug(); }
        else log('Remove result: success');
      }catch(err){
        log('Remove error: ' + msgOf(err) + ' | details=' + jd(err)); showDebug();
      }
    }
    async function doExpSave(){
      if(!xReady || !cur) return;
      if(xSaving){ xDirty = true; return; } // one save at a time, newest edits go last
      xSaving = true; xDirty = false; xPending = false;
      var p = cur;
      try{
        readEditor();
        p.cover_path = coverOf(p.media);
        var row = {
          id: p.id, title: p.title, excerpt: p.excerpt, body: p.body, cover_path: p.cover_path,
          media: p.media.map(cleanEntry), tags: p.tags, published: p.published, updated_at: new Date().toISOString()
        };
        var saved = row.media.map(function(m){ return m.path; });
        if(row.cover_path) saved.push(row.cover_path);
        var res = await sb.from(PTABLE).upsert(row, { onConflict: 'id' });
        if(res.error){
          log('Save error (posts): ' + res.error.message + ' | details=' + jd(res.error)); showDebug();
          setSaved('Save failed — see debug panel');
          return;
        }
        syncRow(p);
        renderList();
        /* delete removed files only once no saved row references them */
        var rm = removals.filter(function(x){ return saved.indexOf(x) === -1; });
        removals = removals.filter(function(x){ return saved.indexOf(x) !== -1; });
        if(rm.length) purge(rm);
        if(xDirty) setSaved('Saving…');
        else { setSaved('Saved ✓'); xHintTimer = setTimeout(function(){ setSaved(''); }, 1500); }
      }catch(err){
        log('Save error (posts): ' + msgOf(err) + ' | details=' + jd(err)); showDebug();
        setSaved('Save failed — see debug panel');
      }finally{
        xSaving = false;
        if(xDirty) doExpSave();
      }
    }
    function waitSaves(){
      return new Promise(function(res){ (function chk(){ if(!xSaving && !xDirty) res(); else setTimeout(chk, 60); })(); });
    }
    async function flushExp(){
      if(!cur) return;
      if(xPending){ clearTimeout(xTimer); await doExpSave(); }
      await waitSaves();
    }

    /* ---------- open / close / new ---------- */
    function openPost(p){
      disarmDel(); clearPreviews(); uploads = [];
      sel = p.id; cur = clonePost(p);
      xTitle.textContent = cur.title;
      xExcerpt.textContent = cur.excerpt;
      setBody(cur.body);
      xTags.textContent = cur.tags.join(', ');
      setPubUI();
      xEditor.hidden = false;
      setSaved(''); setStatus('');
      renderGrid(); renderList();
      xEditor.scrollIntoView({ behavior: calmMotion ? 'auto' : 'smooth', block: 'nearest' });
    }
    async function selectPost(id){
      if(cur && cur.id === id) return;
      if(uploadsBusy()){ setStatus('Uploads in progress — wait for them to finish first.'); return; }
      await flushExp();
      var p = findPost(id);
      if(p) openPost(p);
    }
    async function closeEditor(){
      if(uploadsBusy()){ setStatus('Uploads in progress — wait for them to finish first.'); return; }
      await flushExp();
      cur = null; sel = null; uploads = []; clearPreviews();
      disarmDel(); xEditor.hidden = true; setSaved(''); setStatus('');
      renderList();
    }
    xList.addEventListener('click', function(e){
      var row = e.target.closest ? e.target.closest('.exp-item') : null;
      if(row) selectPost(row.getAttribute('data-id'));
    });
    xList.addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ') return;
      var row = e.target.closest ? e.target.closest('.exp-item') : null;
      if(!row) return;
      e.preventDefault();
      selectPost(row.getAttribute('data-id'));
    });
    xClose.addEventListener('click', function(){ closeEditor(); });
    xNew.addEventListener('click', async function(){
      if(!xReady || xNew.disabled) return;
      if(uploadsBusy()){ setStatus('Uploads in progress — wait for them to finish first.'); return; }
      xNew.disabled = true;
      try{
        await flushExp();
        var r = await sb.from(PTABLE).insert({ title: '', published: false }).select().single();
        if(r.error) throw r.error;
        if(!(r.data && r.data.id && r.data.created_at)){
          log('Save error (posts): insert returned an incomplete row | id=' + (r.data && r.data.id) + ' created_at=' + (r.data && r.data.created_at));
          showDebug();
          setStatus('Could not create a post — see debug panel');
          return;
        }
        posts.unshift(r.data);
        openPost(r.data);
        xTitle.focus();
        log('Post created: ' + r.data.id);
      }catch(err){
        log('Save error (posts): ' + msgOf(err) + ' | details=' + jd(err)); showDebug();
        setStatus('Could not create a post — see debug panel');
      }finally{
        xNew.disabled = false;
      }
    });

    /* ---------- editing ---------- */
    xEditor.addEventListener('input', function(e){
      if(!cur) return;
      var t = e.target;
      if(t.classList && t.classList.contains('exp-cap')){
        var en = cur.media[+t.getAttribute('data-i')];
        if(en) en.caption = t.value;
      } else {
        readEditor();
        var tt = xList.querySelector('.exp-item[data-id="' + cur.id + '"] .exp-t');
        if(tt) tt.textContent = cur.title || 'Untitled';
      }
      scheduleExpSave();
    });
    xEditor.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('data-single')) e.preventDefault();
    });
    /* paste as plain text, same rule as the résumé */
    xEditor.addEventListener('paste', function(e){
      var t = e.target && e.target.closest ? e.target.closest('[contenteditable]') : null;
      if(!t) return;
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text/plain');
      if(text && t.hasAttribute('data-single')) text = text.replace(/\s*[\r\n]+\s*/g, ' ');
      if(text) document.execCommand('insertText', false, text);
    });
    xPub.addEventListener('click', function(){
      if(!cur) return;
      cur.published = !cur.published;
      setPubUI();
      scheduleExpSave();
    });
    xGrid.addEventListener('click', function(e){
      var b = e.target.closest ? e.target.closest('.exp-xbtn') : null;
      if(!b || !cur) return;
      if(b.hasAttribute('data-u')){ cancelUpload(+b.getAttribute('data-u')); return; }
      var i = +b.getAttribute('data-i'), en = cur.media[i];
      if(!en) return;
      cur.media.splice(i, 1);
      removals.push(en.path);
      var pv = previews.get(en.path);
      if(pv){ try{ URL.revokeObjectURL(pv); }catch(x){} previews.delete(en.path); }
      log('Media removed: ' + en.path);
      renderGrid();
      scheduleExpSave();
    });

    /* ---------- uploads ---------- */
    function cancelUpload(id){
      for(var i = 0; i < uploads.length; i++){
        if(uploads[i].id === id){
          var u = uploads[i];
          u.dead = true;
          if(u.xhr){ try{ u.xhr.abort(); }catch(e){} }
          uploads.splice(i, 1);
          break;
        }
      }
      renderGrid();
    }
    function safeName(n){
      var s = String(n || 'file').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^\.+/, '');
      return (s || 'file').slice(-80);
    }
    function swapExt(name, ext){
      var i = name.lastIndexOf('.');
      return (i > 0 ? name.slice(0, i) : name) + '.' + ext;
    }
    function dataUrlToBlob(d){
      var i = d.indexOf(','), mime = d.slice(5, i).split(';')[0];
      var bin = atob(d.slice(i + 1)), n = bin.length, arr = new Uint8Array(n);
      for(var k = 0; k < n; k++) arr[k] = bin.charCodeAt(k);
      return new Blob([arr], { type: mime });
    }
    function getDims(blob, isVideo){
      return new Promise(function(res){
        var url = URL.createObjectURL(blob), done = false;
        function fin(v){ if(done) return; done = true; try{ URL.revokeObjectURL(url); }catch(e){} res(v); }
        if(isVideo){
          var v = document.createElement('video'); v.preload = 'metadata'; v.muted = true;
          v.onloadedmetadata = function(){ fin(v.videoWidth ? { w: v.videoWidth, h: v.videoHeight } : null); };
          v.onerror = function(){ fin(null); };
          v.src = url;
        } else {
          var im = new Image();
          im.onload = function(){ fin({ w: im.naturalWidth, h: im.naturalHeight }); };
          im.onerror = function(){ fin(null); };
          im.src = url;
        }
        setTimeout(function(){ fin(null); }, 4000);
      });
    }
    /* supabase-js has no upload progress callback, so the file goes to the storage REST endpoint
       with the shared client's session token, which is what supabase-js does under the hood */
    function xhrUpload(path, blob, token, u){
      return new Promise(function(resolve, reject){
        var xhr = new XMLHttpRequest(), lastStep = -1;
        u.xhr = xhr;
        xhr.open('POST', SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path.split('/').map(encodeURIComponent).join('/'));
        xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
        xhr.setRequestHeader('x-upsert', 'false');
        xhr.upload.onprogress = function(e){
          if(!e.lengthComputable) return;
          u.pct = Math.round(e.loaded / e.total * 100);
          paintProgress(u);
          var step = Math.floor(u.pct / 25) * 25;
          if(step !== lastStep){ lastStep = step; log('Upload progress: ' + u.name + ' ' + u.pct + '%'); }
        };
        xhr.onload = function(){
          if(xhr.status >= 200 && xhr.status < 300){ resolve(); return; }
          var m = '';
          try{ var j = JSON.parse(xhr.responseText); m = j.message || j.error || ''; }catch(e){}
          var er = new Error(m || ('HTTP ' + xhr.status)); er.statusCode = xhr.status; reject(er);
        };
        xhr.onerror = function(){ reject(new Error('Network error')); };
        xhr.onabort = function(){ var er = new Error('Upload cancelled'); er.cancelled = true; reject(er); };
        var fd = new FormData();
        fd.append('cacheControl', '3600');
        fd.append('', blob, path.split('/').pop());
        xhr.send(fd);
      });
    }
    async function runUpload(u, file, postId){
      var stage = 'start';
      try{
        if(u.dead) return;
        u.state = 'prep'; renderGrid();
        var type = (file.type || '').toLowerCase();
        var ext = (file.name.indexOf('.') !== -1 ? file.name.split('.').pop() : '').toLowerCase();
        if(!type) type = EXT_TYPE[ext] || '';
        log('File selected: ' + file.name + ' size=' + file.size + ' type=' + (type || 'unknown'));
        var bad = '';
        if(!OK_TYPE[type]) bad = 'unsupported file type';
        else if(file.size === 0) bad = 'file is empty';
        var isVideo = type.indexOf('video/') === 0;
        if(!bad && isVideo && file.size > MAX_BYTES) bad = 'video is larger than the 50 MB bucket limit';
        if(bad){
          log('Validation failed: ' + bad);
          throw new Error(bad.charAt(0).toUpperCase() + bad.slice(1));
        }
        log('Validation passed');

        stage = 'prepare';
        var blob = file, outName = file.name;
        if(!isVideo && type !== 'image/gif'){ // videos skip shrinking; GIFs keep their animation
          var dataUrl = await new Promise(function(res){ shrinkImage(file, IMG_MAX, res); });
          if(dataUrl){
            blob = dataUrlToBlob(dataUrl);
            outName = swapExt(file.name, blob.type === 'image/webp' ? 'webp' : 'jpg');
            log('Image shrunk: ' + file.size + ' -> ' + blob.size + ' bytes');
          } else {
            log('Image shrink failed — uploading the original');
          }
        }
        if(blob.size > MAX_BYTES) throw new Error('File is larger than the 50 MB bucket limit');
        if(u.dead) return;

        stage = 'getSession';
        var s = await sb.auth.getSession();
        var sess = s.data && s.data.session;
        if(s.error) throw s.error;
        if(!sess || !sess.access_token || !sess.user) throw new Error('No signed-in user');
        log('User id: ' + sess.user.id);

        stage = 'upload';
        var path = sess.user.id + '/' + postId + '/' + Date.now().toString(36) + '-' + safeName(outName);
        log('Uploading to ' + BUCKET + '/' + path);
        u.state = 'uploading'; u.pct = 0; renderGrid();
        await xhrUpload(path, blob, sess.access_token, u);
        log('Upload result: success');

        stage = 'attach';
        var dims = await getDims(blob, isVideo);
        if(u.dead || !cur || cur.id !== postId){
          log('Upload finished but the post is no longer open — removing the file');
          purge([path]);
          return;
        }
        var entry = { type: isVideo ? 'video' : 'image', path: path, caption: '' };
        if(dims){ entry.width = dims.w; entry.height = dims.h; }
        previews.set(path, URL.createObjectURL(blob));
        cur.media.push(entry);
        var ix = uploads.indexOf(u); if(ix !== -1) uploads.splice(ix, 1);
        renderGrid();
        scheduleExpSave();
      }catch(err){
        if(err && err.cancelled){ log('Upload cancelled: ' + file.name); }
        else if(!u.dead){
          log(errLine(err) + ' | stage=' + stage);
          showDebug();
          u.state = 'error'; u.error = msgOf(err);
          renderGrid();
        }
      }finally{
        u.xhr = null;
      }
    }
    function queueFile(file){
      if(!cur) return;
      var u = { id: ++upSeq, name: file.name, pct: 0, state: 'queued', error: '', xhr: null, dead: false };
      uploads.push(u);
      renderGrid();
      var pid = cur.id;
      upChain = upChain.then(function(){ return runUpload(u, file, pid); });
    }
    function queueFiles(list){
      Array.prototype.slice.call(list || []).forEach(queueFile);
    }
    xFile.addEventListener('change', function(){
      var files = Array.prototype.slice.call(xFile.files || []);
      xFile.value = ''; // lets the same file be picked again
      files.forEach(queueFile);
    });
    /* explicit tap handler: a hidden input inside a label is unreliable in srcdoc iframes on iOS Safari */
    function openPicker(){ xFile.click(); log('Media picker opened (input.click called)'); }
    xDrop.addEventListener('click', openPicker);
    xDrop.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPicker(); }
    });
    ['dragenter', 'dragover'].forEach(function(n){
      xDrop.addEventListener(n, function(e){ e.preventDefault(); xDrop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function(n){
      xDrop.addEventListener(n, function(e){ e.preventDefault(); xDrop.classList.remove('over'); });
    });
    xDrop.addEventListener('drop', function(e){ queueFiles(e.dataTransfer && e.dataTransfer.files); });

    /* ---------- delete (two-click confirm, same pattern as Reset) ---------- */
    var delArmed = false, delTimer = 0;
    function disarmDel(){ delArmed = false; clearTimeout(delTimer); xDel.textContent = 'Delete post'; }
    xDel.addEventListener('click', async function(){
      if(!cur) return;
      if(!delArmed){
        delArmed = true; xDel.textContent = 'Click again to confirm';
        setStatus('Delete removes the post and its media for everyone');
        delTimer = setTimeout(function(){ disarmDel(); setStatus(''); }, 4000);
        return;
      }
      disarmDel(); setStatus('');
      var p = cur, id = p.id;
      clearTimeout(xTimer); xPending = false;
      uploads.forEach(function(u){ u.dead = true; if(u.xhr){ try{ u.xhr.abort(); }catch(e){} } });
      uploads = [];
      cur = null; // no autosave while deleting
      await waitSaves();
      setSaved('Deleting…');
      var stored = findPost(id);
      var paths = [];
      function add(x){ if(x && paths.indexOf(x) === -1) paths.push(x); }
      p.media.forEach(function(m){ add(m.path); });
      add(p.cover_path);
      if(stored){ (stored.media || []).forEach(function(m){ add(m.path); }); add(stored.cover_path); }
      removals.forEach(add);
      try{
        var r = await sb.from(PTABLE).delete().eq('id', id).select('id');
        if(r.error) throw r.error;
        if(!r.data || !r.data.length) throw new Error('nothing was deleted (check policies)');
      }catch(err){
        log('Delete error (posts): ' + msgOf(err) + ' | details=' + jd(err)); showDebug();
        cur = p; sel = id; setSaved('Delete failed — see debug panel');
        return;
      }
      log('Post deleted: ' + id);
      await purge(paths);
      removals = [];
      posts = posts.filter(function(x){ return x.id !== id; });
      sel = null; clearPreviews(); xEditor.hidden = true; setSaved('');
      renderList();
    });

    /* ---------- load ---------- */
    async function loadPosts(){
      setStatus('Loading…');
      try{
        var r = await sb.from(PTABLE).select('*').order('created_at', { ascending: false });
        if(r.error){
          log('Load error (posts): ' + r.error.message + ' | details=' + jd(r.error)); showDebug();
          setStatus('Could not load experiences — see debug panel');
          renderList();
          return;
        }
        posts = r.data || [];
        xReady = true; xNew.disabled = false;
        setStatus('');
        log('Posts loaded: ' + posts.length);
        renderList();
      }catch(err){
        log('Load error (posts): ' + msgOf(err)); showDebug();
        setStatus('Offline — reload the page to edit experiences');
        renderList();
      }
    }
    renderList();
    setTimeout(loadPosts, 0);
    log('Experiences ready');
  }
  try{ initExperiences(); }catch(err){ log('Experiences init failed: ' + (err && err.message ? err.message : String(err))); showDebug(); }

})();
<\/script>

</body>
</html>
</script>

<script type="text/template" id="tpl-viewer">
<!DOCTYPE html>

<head>

<title>Résumé — Read Only</title>
<script>
(function(){try{var p=window.parent.document.documentElement,d=document.documentElement;
  if(p.getAttribute('data-theme')==='light') d.setAttribute('data-theme','light');
  if(p.classList.contains('lite')) d.classList.add('lite');}catch(e){}})();
<\/script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120D0C;
    --line:rgba(255,255,255,0.12);
    --line-soft:rgba(255,255,255,0.06);
    --ink:#F1E9E1;
    --ink-dim:#B9AC9F;
    --ink-faint:#7E7069;
    --sanguine:#7A2027;
    --sanguine-bright:#B03A3F;
    --sanguine-deep:#4E1519;
    --glass-fill: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.37), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
    --radius-lg: 24px;
    --radius-md: 16px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x: hidden;
  }

  ::selection{ background:var(--sanguine-deep); color:var(--ink); }
  h1,h2,h3{ font-family:inherit; font-weight:500; letter-spacing:-0.03em; margin:0; color:var(--ink); }
  a{ color:inherit; }

  #webgl-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
  }

  .stripes {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(176, 58, 63, 0.03) 40px,
      rgba(176, 58, 63, 0.03) 41px
    );
  }

  .side-stripe {
    position: fixed;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(to bottom, var(--sanguine-deep), var(--sanguine-bright), var(--sanguine-deep));
    z-index: 50;
  }

  .glass{
    position:relative;
    background:var(--glass-fill);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 1;
  }

  .glass::after {
    content: "";
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 40%;
    background: radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 48px; position:relative; }
  @media (max-width:860px){ .wrap{ padding:0 24px; } }

  .rail{
    position:fixed; top:50%; left:22px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:20px 11px; border-radius:999px; z-index:60;
  }
  .rail button{
    all:unset; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.25);
    cursor:pointer; transition:all .3s var(--ease);
  }
  .rail button:hover{ background:var(--ink-dim); transform: scale(1.4); }
  .rail button.active{ background:var(--sanguine-bright); transform:scale(2.2); box-shadow: 0 0 12px var(--sanguine-bright); }
  @media (max-width:860px){ .rail{ display:none; } }

  .toolbar{
    position:fixed; top:24px; right:24px; z-index:60; border-radius:999px;
    display:flex; align-items:center; gap:6px; padding:8px 8px 8px 16px;
  }
  .toolbar span.hint{ font-size:12px; color:var(--ink-dim); margin-right:6px; white-space:nowrap; letter-spacing:0.02em; font-weight: 400; }
  .toolbar button{
    all:unset; cursor:pointer; font-family:inherit; font-weight:500; font-size:12px; color:var(--ink);
    padding:10px 16px; border-radius:999px; background:rgba(255,255,255,0.08); border:1px solid transparent;
    transition:all .2s var(--ease);
  }
  .toolbar button:hover{ background:rgba(176, 58, 63, 0.3); border-color:var(--sanguine-bright); color: #fff; }
  .toolbar button:active{ transform:scale(0.96); }
  @media (max-width:640px){ .toolbar span.hint{ display:none; } }

  main{ padding-left:58px; }
  @media (max-width:860px){ main{ padding-left:0; } }

  section{ padding:120px 0; border-bottom:1px solid var(--line-soft); position: relative; }
  section:last-of-type{ border-bottom:none; }
  @media (max-width:860px){ section{ padding:76px 0; } }

  .kicker{ font-family:inherit; font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); margin-bottom:14px; display:block; }
  .section-hint{ font-size:14px; color:var(--ink-faint); max-width:52ch; margin-bottom:48px; font-weight:300; }

  [data-field]{ border-radius:7px; cursor:default; }
  [data-field]:empty:before{ content:attr(data-placeholder); color:var(--ink-faint); font-style:normal; pointer-events:none; }

  #hero{ min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding:150px 0 100px; }

  .hero-card{ padding:56px clamp(28px,5vw,64px); }

  var KEEP = { BR:1, B:1, STRONG:1, I:1, EM:1, U:1, DIV:1, P:1, SPAN:1 };
  var DROP = { SCRIPT:1, STYLE:1, IFRAME:1, OBJECT:1, EMBED:1, TEMPLATE:1 };

  function applyContent(html){

  }

  async function loadFromCloud(){

  }catch(e){ console.warn('[realtime]', e); }
  /* signing out destroys this page; release the channel so the next sign-in can subscribe cleanly */

  /* ============== CV OPEN (signed URL) ============== */
  var cvZone = root.querySelector('#cv-zone');
  async function openCv(){

      log('createSignedUrl called for path: ' + cvPath);

      if(r.error || !r.data || !r.data.signedUrl){
        var err = r.error || new Error('no signed URL returned');
        log('Signed URL error: ' + err.message + ' | details=' + JSON.stringify(err));
        showDebug();
        if(tab) try{ tab.close(); }catch(e){}
        return;
      }
      log('Signed URL result: ok');
      log('Opening new tab');
      if(tab){
        try{ tab.opener = null; }catch(e){}
        tab.location.replace(r.data.signedUrl);
      } else {
        log('Pop-up blocked — allow pop-ups for this site');
        showDebug();
      }
    }catch(err2){
      log('Signed URL error: ' + (err2 && err2.message ? err2.message : String(err2)));
      showDebug();

  if(cvZone){
    cvZone.addEventListener('click', function(){ openCv(); });
    cvZone.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCv(); }

  async function openCert(certPath){
    certPath = safePath(certPath);
    if(!certPath) return;
    var tab = null;

      if(r.error || !r.data || !r.data.signedUrl){

  loadFromCloud();

  /* ============== EXPERIENCES (live, read only) ============== */
  /* Own state, own channel, own table (posts). The résumé load and its realtime channel above are untouched. */
  if(parentLite) document.documentElement.classList.add('lite'); // new panels drop backdrop blur in lower-end device mode

  function initExperiences(){
    var PTABLE = 'posts', BUCKET = 'media';
    function g(id){ return document.getElementById(id); }
    var xList = g('exp-list'), xOpen = g('exp-open');
    if(!xList || !xOpen) return;

    var posts = [], openId = null, fetchSeq = 0, fetchTimer = 0, loaded = false;
    var urlCache = new Map();   // path -> { url, exp } (signed URLs live only here, never in the DOM's data- attributes)
    var urlPending = new Map(); // path -> in-flight signing job

    function jd(err){ try{ return JSON.stringify(err); }catch(x){ return String(err); } }
    function msgOf(err){ return err && err.message ? err.message : String(err); }
    function fmtDate(iso){
      try{ return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }catch(e){ return ''; }
    }

    /* ---------- signed URLs (batched, cached by path) ---------- */
    function cachedUrl(path){
      var c = urlCache.get(path);
      return c && c.exp - Date.now() > 60000 ? c.url : '';
    }
    function signMany(paths){
      var need = [], waits = [];
      paths.forEach(function(p){
        if(!p || cachedUrl(p)) return;
        if(urlPending.has(p)){ waits.push(urlPending.get(p)); return; }
        if(need.indexOf(p) === -1) need.push(p);
      });
      if(need.length){
        var job = (async function(){
          log('createSignedUrl called for path: ' + need.join(', '));
          try{
            var r = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
            if(r.error) throw r.error;
            var okN = 0;
            (r.data || []).forEach(function(row){
              if(row && row.signedUrl){ urlCache.set(row.path, { url: row.signedUrl, exp: Date.now() + 3600 * 1000 }); okN++; }
              else if(row){ log('Signed URL error: ' + (row.error || 'no URL returned') + ' | path=' + row.path); }
            });
            log('Signed URL result: ok (' + okN + '/' + need.length + ')');
          }catch(err){
            log('Signed URL error: ' + msgOf(err) + ' | details=' + jd(err) + ' — retrying one by one');
            await Promise.all(need.map(function(p){
              return sb.storage.from(BUCKET).createSignedUrl(p, 3600).then(function(r){
                if(r.error || !r.data || !r.data.signedUrl) throw (r.error || new Error('no signed URL returned'));
                urlCache.set(p, { url: r.data.signedUrl, exp: Date.now() + 3600 * 1000 });
                log('Signed URL result: ok');
              }).catch(function(e2){
                log('Signed URL error: ' + msgOf(e2) + ' | details=' + jd(e2) + ' | path=' + p);
                showDebug();
              });
            }));
          }
        })();
        need.forEach(function(p){ urlPending.set(p, job); });
        var clear = function(){ need.forEach(function(p){ if(urlPending.get(p) === job) urlPending.delete(p); }); };
        job.then(clear, clear);
        waits.push(job);
      }
      return Promise.all(waits);
    }
    function srcFor(path, isVideo){
      var u = cachedUrl(path);
      return u ? (isVideo ? u + '#t=0.1' : u) : '';
    }
    function applySrcs(box){
      box.querySelectorAll('[data-path]').forEach(function(el){
        if(el.getAttribute('src')) return;
        var s = srcFor(el.getAttribute('data-path'), el.tagName === 'VIDEO');
        if(s) el.src = s;
      });
    }
    function fill(box){
      applySrcs(box);
      var need = [];
      box.querySelectorAll('[data-path]').forEach(function(el){ if(!el.getAttribute('src')) need.push(el.getAttribute('data-path')); });
      if(need.length) signMany(need).then(function(){ applySrcs(box); });
    }
    /* a signed URL that expired while the page stayed open: sign once more and retry once */
    function retryOnce(el){
      el.addEventListener('error', function(){
        if(el.__retried) return;
        el.__retried = true;
        var p = el.getAttribute('data-path');
        if(!p) return;
        urlCache.delete(p);
        signMany([p]).then(function(){ var s = srcFor(p, el.tagName === 'VIDEO'); if(s) el.src = s; });
      });
    }

    /* ---------- rendering ---------- */
    /* body goes through the same allowlist as the résumé text: copyClean builds fresh nodes, so no attributes or scripts survive */
    function renderBody(html, into){
      into.textContent = '';
      var doc;
      try{ doc = new DOMParser().parseFromString('<!DOCTYPE html><body>' + (html || ''), 'text/html'); }catch(e){ return; }
      if(doc && doc.body) copyClean(doc.body, into);
    }
    function mkTags(tags){
      if(!Array.isArray(tags) || !tags.length) return null;
      var box = document.createElement('div'); box.className = 'exp-tags';
      tags.forEach(function(t){
        var s = document.createElement('span'); s.className = 'exp-tag'; s.textContent = String(t); box.appendChild(s);
      });
      return box;
    }
    function listRow(p){
      var row = document.createElement('div');
      row.className = 'exp-item';
      row.setAttribute('role', 'button'); row.tabIndex = 0; row.setAttribute('data-id', p.id);
      var th = document.createElement('div'); th.className = 'exp-thumb';
      if(p.cover_path){
        var im = document.createElement('img'); im.loading = 'lazy'; im.alt = '';
        im.setAttribute('data-path', p.cover_path); retryOnce(im); th.appendChild(im);
      } else { th.textContent = 'no cover'; }
      var mid = document.createElement('div');
      var t = document.createElement('div'); t.className = 'exp-t'; t.textContent = p.title || 'Untitled';
      var m = document.createElement('div'); m.className = 'exp-m'; m.textContent = fmtDate(p.created_at);
      mid.appendChild(t); mid.appendChild(m);
      if(p.excerpt){ var x = document.createElement('div'); x.className = 'exp-x1'; x.textContent = p.excerpt; mid.appendChild(x); }
      var tg = mkTags(p.tags); if(tg) mid.appendChild(tg);
      var go = document.createElement('span'); go.className = 'exp-pill on'; go.textContent = 'Open';
      row.appendChild(th); row.appendChild(mid); row.appendChild(go);
      return row;
    }
    function renderList(){
      xList.textContent = '';
      if(!posts.length){
        var em = document.createElement('div'); em.className = 'exp-empty';
        em.textContent = loaded ? 'No experiences have been published yet.' : 'Loading…';
        xList.appendChild(em);
        return;
      }
      posts.forEach(function(p){ xList.appendChild(listRow(p)); });
      fill(xList);
    }
    function figure(en){
      var fig = document.createElement('figure'); fig.className = 'exp-fig';
      var el;
      if(en.type === 'video'){
        el = document.createElement('video'); el.controls = true; el.preload = 'metadata'; el.setAttribute('playsinline', '');
      } else {
        el = document.createElement('img'); el.loading = 'lazy'; el.alt = en.caption || '';
        if(en.width > 0 && en.height > 0){ el.width = en.width; el.height = en.height; }
      }
      el.setAttribute('data-path', en.path); retryOnce(el);
      fig.appendChild(el);
      if(en.caption){ var c = document.createElement('figcaption'); c.textContent = en.caption; fig.appendChild(c); }
      return fig;
    }
    function renderOpen(p){
      xOpen.textContent = '';
      var back = document.createElement('button'); back.type = 'button'; back.className = 'exp-btn'; back.id = 'exp-back'; back.textContent = '← All experiences';
      var dt = document.createElement('div'); dt.className = 'exp-dt'; dt.style.marginTop = '26px'; dt.textContent = fmtDate(p.created_at);
      var h = document.createElement('h2'); h.className = 'exp-h'; h.textContent = p.title || 'Untitled';
      xOpen.appendChild(back); xOpen.appendChild(dt); xOpen.appendChild(h);
      if(p.excerpt){ var lede = document.createElement('p'); lede.className = 'exp-lede'; lede.textContent = p.excerpt; xOpen.appendChild(lede); }
      var tg = mkTags(p.tags); if(tg) xOpen.appendChild(tg);
      var body = document.createElement('div'); body.className = 'exp-bodyv'; renderBody(p.body, body); xOpen.appendChild(body);
      var media = (Array.isArray(p.media) ? p.media : []).filter(function(m){ return m && m.path; });
      if(media.length){
        var gal = document.createElement('div'); gal.className = 'exp-gal';
        media.forEach(function(m){ gal.appendChild(figure(m)); });
        xOpen.appendChild(gal);
        fill(gal);
      }
    }
    function findPost(id){
      for(var i = 0; i < posts.length; i++){ if(posts[i].id === id) return posts[i]; }
      return null;
    }
    function showList(){
      openId = null;
      xOpen.hidden = true; xList.hidden = false;
    }
    function showOpen(id){
      var p = findPost(id);
      if(!p){ showList(); return; }
      var wasOpen = openId === id;
      openId = id;
      renderOpen(p);
      xList.hidden = true; xOpen.hidden = false;
      if(!wasOpen){
        var sec = g('experiences');
        if(sec) sec.scrollIntoView({ behavior: calmMotion ? 'auto' : 'smooth', block: 'start' });
      }
      setActive();
    }
    function renderAll(){
      renderList();
      if(openId){
        if(findPost(openId)) showOpen(openId);
        else { showList(); log('Open post is no longer published — back to the list'); }
      }
      setActive(); // content height changed
    }

    xList.addEventListener('click', function(e){
      var row = e.target.closest ? e.target.closest('.exp-item') : null;
      if(row) showOpen(row.getAttribute('data-id'));
    });
    xList.addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ') return;
      var row = e.target.closest ? e.target.closest('.exp-item') : null;
      if(!row) return;
      e.preventDefault();
      showOpen(row.getAttribute('data-id'));
    });
    xOpen.addEventListener('click', function(e){
      if(e.target.closest && e.target.closest('#exp-back')){
        showList();
        setActive();
        var sec = g('experiences');
        if(sec) sec.scrollIntoView({ behavior: calmMotion ? 'auto' : 'smooth', block: 'start' });
      }
    });

    /* ---------- load + live updates ---------- */
    async function fetchPosts(){
      var mine = ++fetchSeq; // a newer fetch makes this one stale
      try{
        var r = await sb.from(PTABLE).select('*').eq('published', true).order('created_at', { ascending: false });
        if(mine !== fetchSeq) return;
        if(r.error){
          log('Load error (posts): ' + r.error.message + ' | details=' + jd(r.error)); showDebug();
          loaded = true; renderAll();
          return;
        }
        posts = r.data || [];
        loaded = true;
        log('Posts loaded: ' + posts.length);
        renderAll();
      }catch(err){
        log('Load error (posts): ' + msgOf(err)); showDebug();
        if(mine === fetchSeq){ loaded = true; renderAll(); }
      }
    }
    function queueFetch(){
      clearTimeout(fetchTimer);
      fetchTimer = setTimeout(fetchPosts, 250); // admin autosaves in bursts; coalesce them
    }

    var livePosts = null;
    try{
      livePosts = sb.channel('posts-live')
        .on('postgres_changes',
            { event: '*', schema: 'public', table: PTABLE },
            function(payload){
              log('Realtime posts change: ' + (payload && payload.eventType ? payload.eventType : 'unknown'));
              queueFetch();
            })
        .subscribe();
    }catch(e){ console.warn('[realtime posts]', e); }
    /* signing out destroys this page; release the channel so the next sign-in can subscribe cleanly */
    window.addEventListener('pagehide', function(){ try{ if(livePosts) sb.removeChannel(livePosts); }catch(e){} });
    /* realtime only delivers rows a viewer can read, so an un-publish may not arrive as an event; catch up when the tab returns */
    document.addEventListener('visibilitychange', function(){ if(!document.hidden && loaded) queueFetch(); });

    renderList();
    fetchPosts();
    log('Experiences ready');
  }
  try{ initExperiences(); }catch(err){ log('Experiences init failed: ' + (err && err.message ? err.message : String(err))); showDebug(); }

})();
